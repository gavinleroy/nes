<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>nes</title>
<style>
body { background: #111; color: #ddd; font-family: monospace; display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 24px; }
nes-player { width: 512px; height: 480px; background: #000; }
nes-player::part(overlay) { background: rgba(0, 0, 0, 0.7); font-size: 24px; }
button, input { font-family: monospace; }
#controls { display: flex; gap: 8px; align-items: center; }
</style>
</head>
<body>
<div id="mount"></div>
<div id="controls">
<input type="file" id="rom" accept=".nes">
<button id="reset">reset</button>
<button id="save">save state</button>
<button id="load">load state</button>
</div>
<div>arrows move, z = A, x = B, enter = start, shift = select</div>
<script type="module">
import "./nes-player.js";

let player = null;
let savedState = null;

document.getElementById("rom").addEventListener("change", e => {
  const file = e.target.files[0];
  if (!file) return;
  player?.remove();
  player = document.createElement("nes-player");
  player.setAttribute("src", URL.createObjectURL(file));
  player.addEventListener("nes-error", () => alert("unsupported rom"));
  document.getElementById("mount").append(player);
});

document.getElementById("reset").addEventListener("click", () => player?.reset());
document.getElementById("save").addEventListener("click", () => { savedState = player?.saveState(); });
document.getElementById("load").addEventListener("click", () => { if (savedState) player?.loadState(savedState); });
</script>
</body>
</html>
